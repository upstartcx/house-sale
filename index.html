<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving House Sale</title>
<meta name="description" content="Browse and buy quality secondhand household goods — message the seller on WhatsApp.">
<meta property="og:title" content="Moving House Sale">
<meta property="og:description" content="Browse and buy quality secondhand household goods — message the seller on WhatsApp.">
<style>
:root{--ink:#20241f;--mut:#6b7168;--bg:#f4f3ee;--card:#fff;--line:#e5e3d9;--acc:#128c7e;--wa:#25d366}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}img{max-width:100%;display:block}button{font:inherit;cursor:pointer}.wrap{max-width:1140px;margin:auto;padding:0 16px}.top{position:sticky;top:0;background:rgba(244,243,238,.95);border-bottom:1px solid var(--line);z-index:10}.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px}.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#128c7e,#25d366);display:grid;place-items:center;font-size:20px}.brand h1{font-size:18px;margin:0}.brand div{font-size:12px;color:var(--mut)}.btn{display:inline-flex;align-items:center;gap:7px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none}.btn.wa{background:var(--wa);color:#083018}.hero{padding:24px 0 8px}.hero h2{margin:0 0 6px;font-size:clamp(21px,4vw,29px)}.hero p{margin:0;color:var(--mut);max-width:680px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 6px}.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}.toolbar input{flex:1;min-width:190px}.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.count{color:var(--mut);font-size:13px;margin:4px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;padding:12px 0 40px}@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:18px}}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.06);display:flex;flex-direction:column}.ph{aspect-ratio:4/3;background:#ecebef;cursor:pointer}.ph img{width:100%;height:100%;object-fit:cover}.soldtag{position:relative}.soldtag span{position:absolute;left:10px;top:10px;background:#2e2e2e;color:#fff;font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px}.card.sold{opacity:.65}.pad{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}.title{font-weight:650;font-size:14.5px;cursor:pointer}.desc{font-size:12.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pricerow{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}.price{font-weight:750;color:#0b7d55}.cond{font-size:10.5px;background:#e7f6f3;color:#0c6e61;padding:2.5px 8px;border-radius:99px;font-weight:650}.ask{padding:0 12px 12px}.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 16px}.fab{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--wa);border:0;font-size:25px;box-shadow:0 8px 24px rgba(37,211,102,.5)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:20px 12px;z-index:50}.modal.open{display:grid}.panel{background:#fff;border-radius:16px;max-width:740px;width:100%;max-height:90vh;overflow:auto;position:relative}.close{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line)}.mphoto{aspect-ratio:4/3;background:#ecebef}.mphoto img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:8px;padding:10px 14px 0;overflow-x:auto}.thumbs img{width:72px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}.thumbs img.on{border-color:var(--acc)}.mbody{padding:14px 16px 18px}.mbody h3{margin:0;font-size:19px}.mdesc{white-space:pre-wrap;color:#3f443c;margin:10px 0 16px}footer{border-top:1px solid var(--line);padding:20px 0 90px;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<div class="logo">🛍️</div>
<div class="brand"><h1 id="shopTitle">Moving House Sale</h1><div id="sellerLine">Moving house — everything must go 🚚</div></div>
<div style="flex:1"></div>
<a id="contactBtn" class="btn wa" target="_blank" rel="noopener">💬 Contact seller</a>
</div></header>
<main>
<div class="wrap hero"><h2>Moving house — grab a bargain 🏷️</h2><p id="shopNote"></p></div>
<div class="wrap">
<div class="toolbar">
<input id="search" type="search" placeholder="Search items…">
<select id="sort">
<option value="new">Newest first</option><option value="old">Oldest first</option><option value="pa">Price: low to high</option><option value="pd">Price: high to low</option><option value="t">A–Z</option>
</select>
<label style="display:flex;align-items:center;gap:6px;font-size:13px"><input id="showSold" type="checkbox"> Show sold</label>
</div>
<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
</div>
</main>
<footer><div class="wrap">Moving House Sale · Browse the items and message me on WhatsApp.</div></footer>
<button class="fab" id="fab" aria-label="WhatsApp">💬</button>
<div class="modal" id="modal"><div class="panel">
<button class="close" id="closeModal">✕</button>
<div class="mphoto"><img id="modalPhoto" alt=""></div>
<div class="thumbs" id="thumbs"></div>
<div class="mbody">
<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h3 id="modalTitle"></h3><div id="modalPrice" style="font-weight:750;color:#0b7d55"></div></div>
<div id="modalTags" style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap"></div>
<div class="mdesc" id="modalDesc"></div>
<a id="modalWA" class="btn wa" target="_blank" rel="noopener">💬 Ask about this item</a>
</div>
</div></div>
<script>
let DATA={settings:{},items:[]};let state={q:'',sort:'new',sold:false,cat:'',item:null,photo:0};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const v=Number(n)||0;return 'R'+v.toLocaleString('en-ZA')};
async function load(){try{const r=await fetch('./data/items.json',{cache:'no-store'});DATA=await r.json()}catch(e){DATA={settings:{},items:[]}}render()}
function wa(number,text){return number?'https://wa.me/'+String(number).replace(/\D/g,'')+'?text='+encodeURIComponent(text):null}
function filtered(){let a=DATA.items.slice();if(!state.sold)a=a.filter(x=>x.status!=='sold');if(state.cat)a=a.filter(x=>x.cat===state.cat);const q=state.q.toLowerCase();if(q)a=a.filter(x=>((x.title||'')+' '+(x.desc||'')+' '+(x.cat||'')).toLowerCase().includes(q));if(state.sort==='new')a.sort((x,y)=>new Date(y.created||0)-new Date(x.created||0));if(state.sort==='old')a.sort((x,y)=>new Date(x.created||0)-new Date(y.created||0));if(state.sort==='pa')a.sort((x,y)=>(x.price||0)-(y.price||0));if(state.sort==='pd')a.sort((x,y)=>(y.price||0)-(x.price||0));if(state.sort==='t')a.sort((x,y)=>String(x.title).localeCompare(String(y.title)));return a}
function render(){const s=DATA.settings||{};document.title=s.shopTitle||'Moving House Sale';document.getElementById('shopTitle').textContent=s.shopTitle||'Moving House Sale';document.getElementById('sellerLine').textContent=(s.sellerName?s.sellerName+' · ':'')+'Moving house — everything must go 🚚';document.getElementById('shopNote').textContent=s.note||'';const w=wa(s.waNumber,'Hi! I saw your moving sale — I’m interested in some items.');document.getElementById('contactBtn').href=w||'#';document.getElementById('fab').onclick=()=>w&&window.open(w,'_blank');const cats=[...new Set(DATA.items.filter(i=>i.status!=='sold'&&i.cat).map(i=>i.cat))];document.getElementById('chips').innerHTML=['',...cats].map(c=>'<button class="chip'+(state.cat===c?' on':'')+'" data-cat="'+esc(c)+'">'+(c?esc(c):'All')+'</button>').join('');const items=filtered();document.getElementById('count').textContent=items.length+' item'+(items.length===1?'':'s')+' available';document.getElementById('grid').innerHTML=items.length?items.map(card).join(''):'<div class="empty"><div style="font-size:36px">📦</div><p><b>Nothing listed yet.</b></p><p>Items will appear here soon.</p></div>'}
function card(i){const sold=i.status==='sold';const img=(i.photos||[])[0];const price=sold?'Sold — thank you! 🎉':(i.pmode==='offers'?'Your offer':money(i.price));return '<div class="card'+(sold?' sold':'')+'"><div class="ph'+(sold?' soldtag':'')+'" data-open="'+esc(i.id)+'">'+(img?'<img loading="lazy" src="'+esc(img)+'" alt="'+esc(i.title)+'">':'<div style="display:grid;place-items:center;height:100%;font-size:26px">🖼️</div>')+(sold?'<span>SOLD</span>':'')+'</div><div class="pad"><div class="title" data-open="'+esc(i.id)+'">'+esc(i.title)+'</div><div class="desc">'+esc(i.desc||'')+'</div><div class="pricerow"><div class="price">'+price+'</div><div class="cond">'+esc(i.cond||'')+'</div></div></div><div class="ask"><button class="btn wa" style="width:100%" data-wa="'+esc(i.id)+'">💬 '+(i.pmode==='fixed'?'Ask about this':'Make an offer')+'</button></div></div>'}
function openItem(id){const i=DATA.items.find(x=>x.id===id);if(!i)return;state.item=i;state.photo=0;document.getElementById('modalTitle').textContent=i.title;document.getElementById('modalDesc').textContent=i.desc||'';document.getElementById('modalTags').innerHTML=[i.cat,i.cond,i.pmode==='onco'?'ONCO':''].filter(Boolean).map(x=>'<span class="cond">'+esc(x)+'</span>').join('');document.getElementById('modalPrice').textContent=i.status==='sold'?'Sold':(i.pmode==='offers'?'Your offer':money(i.price));const photos=i.photos||[];document.getElementById('modalPhoto').src=photos[0]||'';document.getElementById('thumbs').innerHTML=photos.map((p,n)=>'<img src="'+esc(p)+'" class="'+(n===0?'on':'')+'" data-photo="'+n+'">').join('');const msg=i.pmode==='offers'?'Hi! I’m interested in the “'+i.title+'”. My offer: R':i.pmode==='onco'?'Hi! Is the “'+i.title+'” still available? I could give R':'Hi! Is the “'+i.title+'” still available?';document.getElementById('modalWA').href=wa(DATA.settings.waNumber,msg)||'#';document.getElementById('modal').classList.add('open')}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open)return openItem(open.dataset.open);const w=e.target.closest('[data-wa]');if(w){const i=DATA.items.find(x=>x.id===w.dataset.wa);const msg=i.pmode==='offers'?'Hi! I’m interested in the “'+i.title+'”. My offer: R':i.pmode==='onco'?'Hi! Is the “'+i.title+'” still available? I could give R':'Hi! Is the “'+i.title+'” still available?';const u=wa(DATA.settings.waNumber,msg);if(u)window.open(u,'_blank');return}const c=e.target.closest('[data-cat]');if(c){state.cat=c.dataset.cat;render();return}const p=e.target.closest('[data-photo]');if(p){const n=+p.dataset.photo;document.getElementById('modalPhoto').src=state.item.photos[n];document.querySelectorAll('#thumbs img').forEach(x=>x.classList.remove('on'));p.classList.add('on');return}if(e.target.id==='closeModal'||e.target.id==='modal')document.getElementById('modal').classList.remove('open')});
document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value;render()});document.getElementById('sort').addEventListener('change',e=>{state.sort=e.target.value;render()});document.getElementById('showSold').addEventListener('change',e=>{state.sold=e.target.checked;render()});
load();
</script>
</body>
</html>
