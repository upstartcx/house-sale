<script id="app">
(async function(){
'use strict';
/* ================= helpers ================= */
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,42)||'secondhand-sale';
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=Number(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const optList=(list,cur)=>list.map(v=>'<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(v)+'</option>').join('');

/* ================= constants ================= */
const CONDITIONS=['Brand new','Excellent','Good','Fair','Needs fixing'];
const CATS=['Furniture','Appliances','Electronics','Kitchen','Décor','Baby & kids','Tools & DIY','Sport & outdoors','Books & media','Clothing','Garden','Other'];
const CUR_SYMBOL={ZAR:'R',USD:'$',EUR:'€',GBP:'£',KES:'KSh ',NGN:'₦',INR:'₹',AUD:'A$',CAD:'C$',NZD:'NZ$',GHS:'GH₵',TZS:'TSh ',UGX:'USh ',BWP:'P',MUR:'₨',MZN:'MT ',ZMW:'ZK ',CHF:'CHF ',AED:'AED ',SAR:'SAR '};
const COUNTRY_NAME={ZA:'South Africa',GB:'United Kingdom',US:'United States',IE:'Ireland',AU:'Australia',NZ:'New Zealand',CA:'Canada',IN:'India',KE:'Kenya',NG:'Nigeria',GH:'Ghana',TZ:'Tanzania',UG:'Uganda',BW:'Botswana',MZ:'Mozambique',ZM:'Zambia',MU:'Mauritius',XX:'Other / International'};
const REGION_CUR={ZA:'ZAR',GB:'GBP',AU:'AUD',NZ:'NZD',IE:'EUR',CA:'CAD',IN:'INR',KE:'KES',NG:'NGN',GH:'GHS',TZ:'TZS',UG:'UGX',BW:'BWP',MU:'MUR',MZ:'MZN',ZM:'ZMW',DE:'EUR',FR:'EUR',ES:'EUR',NL:'EUR',PT:'EUR',IT:'EUR',AT:'EUR',BE:'EUR',FI:'EUR',GR:'EUR',CH:'CHF',AE:'AED',SA:'SAR',US:'USD'};
const AI_SYS='You are an expert secondhand-goods pricing assistant. Given text and photos of an item for sale on online classifieds, reply ONLY with a compact JSON object, no markdown: {"title":"short catchy listing title (max 60 chars)","min":integer,"max":integer,"reason":"one short sentence mentioning comparable listings"}. min and max are a realistic asking-price range in the currency and market given by the user. Be practical and conservative.';
const FILL_SYS='You write secondhand classifieds listings for a South African home sale. Given photos of ONE household item, reply ONLY with compact JSON, no markdown: {"title":"...","desc":"...","cat":"...","cond":"...","min":integer,"max":integer,"reason":"..."}. "title": max 60 characters, no emojis, no ALL CAPS, no "for sale" — use the common local name for the item. "desc": 1-2 short factual sentences based only on what is visible (what it is, apparent colour/material, visible wear or marks) — never invent brands, sizes or features you cannot see. "cond": be honest per the options given — light wear = Good, heavy wear = Fair, damaged or broken = Needs fixing, and let it lower the price. min/max: a conservative local asking-price range for the whole item in the currency the user gives, in whole numbers. "reason": one short sentence.';

/* ================= state ================= */
let DATA=null, SECRETS={}, toastTimer=null;
const S={mode:'public',admin:false,editing:null,openForm:false,stage:[],ai:{},viewing:null,pi:0,q:'',sort:'new',sold:false,cat:''};

/* ================= storage (IndexedDB + fallback) ================= */
function idbOpen(){return new Promise((ok,no)=>{const r=indexedDB.open('secondhand-sale',1);r.onupgradeneeded=e=>{try{e.target.result.createObjectStore('kv')}catch(_){}};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});}
async function kvGet(k){
  try{const db=await idbOpen();return await new Promise((ok,no)=>{const rq=db.transaction('kv').objectStore('kv').get(k);rq.onsuccess=()=>ok(rq.result==null?null:rq.result);rq.onerror=()=>no(rq.error)}) }
  catch(e){try{return JSON.parse(localStorage.getItem('hhs_'+k)||'null')}catch(_){return null}}
}
async function kvSet(k,v){
  try{const db=await idbOpen();return await new Promise((ok,no)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok(true);t.onerror=()=>no(t.error)})}
  catch(e){try{localStorage.setItem('hhs_'+k,JSON.stringify(v))}catch(_){}return true}
}
function stampT(ts){const d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function updateSaveStat(st){
  const el=$('#saveStat');if(!el)return;
  if(st==='pending'){el.textContent='💾 Saving…';el.style.color='#8a6d1d';return}
  el.textContent='💾 Saved to this device · '+stampT(Date.now());el.style.color='';
}
function persist(){
  DATA.savedAt=Date.now();
  updateSaveStat('pending');
  return kvSet('data',DATA).then(()=>updateSaveStat('done'),()=>updateSaveStat('done'));
}
function saveSecrets(){
  const el=$('#saveStat');if(el){el.textContent='💾 Saving…';el.style.color='#8a6d1d'}
  return saveSecretsDo().then(()=>{const e=$('#saveStat');if(e){e.textContent='💾 Saved to this device · '+stampT(Date.now());e.style.color=''}},()=>{});
}
function saveSecretsDo(){return kvSet('secrets',SECRETS)}
/* Warn before closing a tab with an unsaved item form */
function unsavedDraft(){
  if(!S.admin)return false;
  if(!$('#itemform'))return false;
  const t=(($('#f_title')||{}).value||'').trim(),d=(($('#f_desc')||{}).value||'').trim(),p=String(num(($('#f_price')||{}).value));
  const st=S.stage||[];
  const it=S.editing?find(S.editing):null;
  if(!it)return !!(t||d||st.length);
  return !!((t!==it.title.trim())||(d!==String(it.desc||'').trim())||(p!==String(num(it.price)))||(st.length!==((it.photos||[]).length)));
}

/* ================= defaults ================= */
function guessRegion(){try{const l=new Intl.Locale((navigator.language||'en'));return l.region||'US'}catch(e){return 'US'}}
function guessCurrency(){const r=guessRegion();return REGION_CUR[r]||'USD'}
function defaultData(){
  return {v:1,savedAt:0,settings:{shopTitle:'Moving House Sale',sellerName:'',waNumber:'27845551033',currency:'ZAR',country:'ZA',note:'I\u2019m moving house and can\u2019t take everything with me — these items need new homes! Priced to go and offers happily considered. WhatsApp me anytime.',maxDim:1280,jpgQ:0.82},items:[]};
}
function defaultized(d){
  d=d||{};const X=defaultData();
  d.v=1;d.items=Array.isArray(d.items)?d.items:[];
  d.settings=Object.assign({},X.settings,d.settings||{});
  return d;
}
const shopTitle=()=>DATA.settings.shopTitle||'Moving House Sale';
const find=id=>DATA.items.find(x=>x.id===id);
function fmt(n){
  const c=DATA.settings.currency||'ZAR';n=num(n);
  const d=(n%1)?2:0;
  const ns=n.toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d});
  if(CUR_SYMBOL[c])return CUR_SYMBOL[c]+ns;
  try{return new Intl.NumberFormat('en',{style:'currency',currency:c,minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}
  catch(e){return c+' '+ns}
}
function waNum(){return String(DATA.settings.waNumber||'').replace(/[^0-9]/g,'')}
function hasWA(){return waNum().length>=8}
function shareText(){
  const st=shopTitle();const online=/^https?:/i.test(location.href)?location.href:'';
  return online?st+' 🚚 I\u2019m moving house and selling what I won\u2019t be taking — browse here and WhatsApp me: '+online
    :st+' 🚚 I\u2019m moving house and selling what I won\u2019t be taking — see the file I attached (open it in any browser) and WhatsApp me with an offer!';
}
function waContactUrl(){if(!hasWA())return null;return 'https://wa.me/'+waNum()+'?text='+encodeURIComponent('Hi! I saw your moving sale — I\u2019m interested in some items.')}
function waItemUrl(it){
  if(!hasWA())return null;
  const t=it.title;let msg;
  if(it.pmode==='offers')msg='Hi! I\u2019m interested in the \u201c'+t+'\u201d from your moving sale. My offer: R';
  else if(it.pmode==='onco')msg='Hi! Is the \u201c'+t+'\u201d ('+fmt(it.price)+' ONCO) still available? I could give R';
  else msg='Hi! Is the \u201c'+t+'\u201d ('+fmt(it.price)+') still available?';
  return 'https://wa.me/'+waNum()+'?text='+encodeURIComponent(msg);
}
/* price display: fixed / ONCO / offers */
function legacyPmode(it){return (it&&num(it.price)>0)?'fixed':'offers'}
function pmodeOf(it){return it&&it.pmode?it.pmode:legacyPmode(it)}
function priceHTML(it,sold){
  if(sold)return 'Sold — thank you! 🎉';
  if(pmodeOf(it)==='offers')return 'Your offer';
  return esc(fmt(it.price));
}
function oncoBadge(it,sold){return (!sold&&pmodeOf(it)==='onco')?'<span class="onco" title="Or nearest cash offer">ONCO</span>':''}
function ctaLabel(it){return (pmodeOf(it)==='fixed')?'💬 Ask about this':'💬 Make an offer'}
function waShareUrl(){return 'https://wa.me/?text='+encodeURIComponent(shareText())}
function openWA(url){if(!url){toast('Seller has not set a WhatsApp number yet');return}const w=window.open(url,'_blank');if(!w)location.href=url;}
/* ================= photos ================= */
function readFile(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
function loadImg(url){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url})}
async function processPhoto(file){
  let url;
  try{url=await readFile(file)}catch(e){toast('Could not read that file');return null}
  try{
    const img=await loadImg(url);
    const md=num(DATA.settings.maxDim)||1280,q=Math.min(.95,Math.max(.4,num(DATA.settings.jpgQ)||.82));
    const k=Math.min(1,md/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
    return c.toDataURL('image/jpeg',q);
  }catch(e){toast('Unsupported photo format — try JPG/PNG (or Safari for iPhone HEIC photos)');return null}
}
async function addPhotos(input){
  const fs=Array.from(input.files||[]);input.value='';
  if(!fs.length)return;
  if(S.stage.length>=8){toast('Maximum 8 photos per item');return}
  toast('Processing photo'+(fs.length>1?'s':'')+'…');
  let ok=0;
  for(const f of fs){
    if(S.stage.length>=8){toast('Limit reached: max 8 photos');break}
    const u=await processPhoto(f);
    if(u){S.stage.push(u);ok++}
  }
  if(ok){renderStrip();autoFill();return}
  toast(ok?'':'Photo could not be used');
  renderStrip();
}
function renderStrip(){const el=$('#phstrip');if(el)el.innerHTML=stripHTML()}
function stripHTML(){
  if(!S.stage.length)return '<div class="hint">No photos yet — add at least one good photo.</div>';

function demoPhoto(ch,label,h1,h2){
  const c=document.createElement('canvas');c.width=800;c.height=600;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,800,600);gr.addColorStop(0,'hsl('+h1+',38%,84%)');gr.addColorStop(1,'hsl('+h2+',34%,60%)');
  g.fillStyle=gr;g.fillRect(0,0,800,600);
  g.textAlign='center';g.textBaseline='middle';g.font='210px serif';g.globalAlpha=.92;g.fillText(ch,400,300);
  g.globalAlpha=1;g.fillStyle='rgba(25,30,25,.6)';g.font='bold 40px sans-serif';g.fillText(label,400,530);
  return c.toDataURL('image/jpeg',.85);
}

/* ================= toasts ================= */
function toast(m){
  let t=document.getElementById('hhs-toast');
  if(!t){t=document.createElement('div');t.id='hhs-toast';document.body.appendChild(t)}
  t.textContent=m;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);
}

/* ================= filtering ================= */
function filtered(){
  let a=DATA.items.slice();
  if(!S.sold)a=a.filter(x=>x.status!=='sold');
  if(S.cat)a=a.filter(x=>(x.cat||'')===S.cat);
  const q=S.q.trim().toLowerCase();
  if(q)a=a.filter(x=>(x.title+' '+(x.desc||'')+' '+(x.cat||'')).toLowerCase().includes(q));
  const s=S.sort;
  a.sort((x,y)=>s==='new'?((y.created||0)-(x.created||0)):s==='old'?((x.created||0)-(y.created||0)):s==='pa'?((x.price||0)-(y.price||0)):s==='pd'?((y.price||0)-(x.price||0)):String(x.title).localeCompare(String(y.title)));
  return a;
}
function uniqCats(){
  const m=new Map();
  DATA.items.forEach(i=>{if(i.status!=='sold'&&i.cat)m.set(i.cat,1)});
  return Array.from(m.keys());
}

function hashPw(pw,salt){
  return new Promise(ok=>{
    try{crypto.subtle.digest('SHA-256',new TextEncoder().encode((salt||'')+'|'+pw)).then(b=>{ok(Array.from(new Uint8Array(b)).map(x=>('0'+x.toString(16)).slice(-2)).join(''))}).catch(()=>{
      ok(plainHash(pw,salt));});}
    catch(e){ok(plainHash(pw,salt))}
  });
}
function plainHash(pw,salt){let h=5381;const s=(salt||'')+'|'+pw;for(let i=0;i<s.length;i++){h=(((h<<5)+h)+s.charCodeAt(i))>>>0}return 'x'+h.toString(16)}
function randHex(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a).map(x=>('0'+x.toString(16)).slice(-2)).join('')}

function startListeners(){
  const R=$('#root');
  R.addEventListener('click',onClick);
  R.addEventListener('change',onChange);
  R.addEventListener('input',e=>{if(e.target&&e.target.id==='pq'){S.q=e.target.value;renderGrid()}});
  R.addEventListener('submit',onSubmit);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.viewing){S.viewing=null;S.pi=0;render()}});
  window.addEventListener('hashchange',()=>{if(location.hash==='#admin')S.mode='admin';render()});

function onClick(e){
  const t=e.target.closest('[data-act]');
  if(!t||t.dataset.act==='stop')return;
  const a=t.dataset.act,id=t.dataset.id,v=t.dataset.v;
  e.preventDefault();
  switch(a){
    case 'admin':S.mode='admin';render();break;
    case 'exitAdmin':S.mode='public';render();break;
    case 'logout':S.admin=false;try{sessionStorage.removeItem('hhsAdmin')}catch(_){}S.mode='public';render();toast('Logged out');break;
    case 'waContact':openWA(waContactUrl());break;
    case 'waItem':{const it=find(id);if(it)openWA(waItemUrl(it));break}
    case 'waShare':openWA(waShareUrl());break;
    case 'open':S.viewing=id;S.pi=0;render();break;
    case 'closeModal':S.viewing=null;S.pi=0;render();break;
    case 'mthumb':S.pi=num(v);updateModal();break;
    case 'cat':if(v&&S.cat===v)S.cat='';else S.cat=v||'';render();break;
    case 'copyShare':navigator.clipboard&&navigator.clipboard.writeText(shareText()).then(()=>toast('Share text copied ✓')).catch(()=>toast(shareText()));break;
    case 'new':S.editing=null;S.stage=[];S.ai={};S.openForm=true;render();break;
    case 'edit':{const it=find(id);if(it){S.editing=id;S.stage=(it.photos||[]).slice();S.ai={};S.openForm=true;render()}break}
    case 'cancel':S.editing=null;S.stage=[];S.ai={};S.openForm=false;render();break;
    case 'del':{const it=find(id);if(it&&confirm('Delete \u201c'+it.title+'\u201d? This cannot be undone.')){DATA.items=DATA.items.filter(x=>x.id!==id);persist();rerenderAdmin();toast('Deleted')}break}
    case 'up':case 'down':{const i=DATA.items.findIndex(x=>x.id===id);const j=a==='up'?i-1:i+1;
      if(i>=0&&j>=0&&j<DATA.items.length){const tmp=DATA.items[i];DATA.items[i]=DATA.items[j];DATA.items[j]=tmp;persist();rerenderAdmin()}break}
    case 'pick':{const p=$('#photoInput');if(p)p.click();break}
    case 'rmp':{const i=num(v);if(i>=0&&i<S.stage.length){S.stage.splice(i,1);renderStrip()}break}
    case 'web':fillWebLinks();break;
    case 'ai':doAI();break;
    case 'aimin':case 'aimid':{
      const r=S.ai.res;if(!r||$('#f_price')===null)break;
      const val=a==='aimin'?num(r.min):Math.round((num(r.min)+num(r.max))/2);
      $('#f_price').value=val;toast('Price set to '+fmt(val)+' — adjust as you like');break}
    case 'aititle':{const r=S.ai.res;const tf=$('#f_title');if(r&&tf){if(r.title)tf.value=String(r.title).slice(0,80);toast('Title updated')}break}
    case 'aicat':{const r=S.ai.res;const cf=$('#f_cat');if(r&&r.cat&&cf){cf.value=r.cat;toast('Category set to '+r.cat)}break}
    case 'saveSettings':saveSettings();break;
    case 'saveAi':saveAi();break;
    case 'presetGoogle':{const b=$('#a_base'),m=$('#a_model');if(b)b.value='https://generativelanguage.googleapis.com/v1beta/openai';if(m)m.value='gemini-2.5-flash';toast('Google settings filled — paste your key and save');break}
    case 'showAiSetup':{const dsec=Array.from(document.querySelectorAll('details.sec')).find(x=>/Photo auto-fill|Price suggestions/.test(x.textContent));if(dsec){dsec.open=true;const sm=dsec.querySelector('summary');if(sm)sm.scrollIntoView({behavior:'smooth',block:'start'})}break}
    case 'ghPublish':ghPublish();break;
    case 'ghSave':{
      const gf=$('#gh_key');
      SECRETS.ghToken=gf?gf.value.trim():'';
      SECRETS.ghOwner=($('#gh_owner').value.trim()||'upstartcx').slice(0,60);
      SECRETS.ghRepo=($('#gh_repo').value.trim()||'house-sale').slice(0,60);
      if(!SECRETS.ghToken){toast('No token entered — paste it first');return}
      saveSecrets();
      const hint=document.getElementById('ghhint');
      if(hint)hint.innerHTML='Token saved ✓ · publishes <b>your saved catalog</b> to <a class="lnk" target="_blank" rel="noopener" href="'+esc(ghLiveUrl())+'">'+esc(ghLiveUrl())+'</a>';
      toast('Token saved — publishing…');
      ghPublish();
      break}
    case 'aiSkip':{const o=$('#aiout');if(o){o.style.display='none';o.innerHTML=''}break}
    case 'testKey':testKey();break;
    case 'dlExport':exportHTML('html');break;
    case 'preview':window.open(location.href.split('#')[0],'_blank');break;
    case 'expJson':exportHTML('json');break;
    case 'pickImp':{const p=$('#importInput');if(p)p.click();break}
    case 'loadDemo':loadDemo();break;
  }
}
function onChange(e){

    if(pw)pw.style.display=m==='offers'?'none':'';
    if(ph)ph.textContent=pmodeHint(m);

  }

async function onSubmit(e){
  e.preventDefault();
  const id=e.target.id;
  if(id==='loginform'){
    const pw=$('#lpw').value;
    if(await hashPw(pw,SECRETS.salt||'')===SECRETS.pwHash){
      S.admin=true;try{sessionStorage.setItem('hhsAdmin','1')}catch(_){}
      render();
    }else{toast('Wrong password');$('#lpw').value='';$('#lpw').focus()}
  }
  else if(id==='fpform'){
    const a=$('#fp1').value,b=$('#fp2').value;
    if(a!==b){toast('Passwords don\u2019t match');return}
    SECRETS.salt=randHex(16)||String(Date.now());
    SECRETS.pwHash=await hashPw(a,SECRETS.salt);
    await saveSecrets();
    S.admin=true;try{sessionStorage.setItem('hhsAdmin','1')}catch(_){}
    render();toast('Password saved ✓ — you\u2019re in!');
  }
  else if(id==='itemform'){saveItem()}
}
function saveItem(){
  const title=$('#f_title').value.trim();
  const desc=$('#f_desc').value.trim();
  const pmode=($('#f_pmode')||{value:'fixed'}).value;
  let price=Math.max(0,num($('#f_price').value));
  if(pmode==='offers')price=0;
  if((pmode==='fixed'||pmode==='onco')&&!(price>0)){
    toast(pmode==='onco'?'ONCO needs a starting price, e.g. 2850 — buyers will offer around it':'Fixed price items need a price');
    return;
  }
  const cond=$('#f_cond').value,cat=$('#f_cat').value;
  if(!title&&!S.stage.length){toast('Give the item a title — and a photo or two helps buyers');return}
  const old=S.editing?find(S.editing):null;
  const base=old?Object.assign({},old):{id:uid(),created:Date.now(),status:'available',ai:null};
  const it=Object.assign(base,{title:title||'Untitled item',desc,cond,cat,pmode,price,photos:S.stage.slice(0,8)});
  if(S.ai.res&&num(S.ai.res.max)>0)it.ai=S.ai.res;
  if(!old)DATA.items.unshift(it);
  persist();
  S.editing=null;S.stage=[];S.ai={};S.openForm=false;
  render();toast(old?'Saved ✓':'Item added ✓');
}

function importBackup(input){
  const f=input.files&&input.files[0];input.value='';
  if(!f)return;
  f.text().then(txt=>{
    let d;
    try{d=JSON.parse(txt);if(!d||!Array.isArray(d.items))throw new Error('bad')}
    catch(err){toast('That file doesn\u2019t look like a valid backup');return}
    if(!confirm('Replace the current catalog and settings with this backup ('+d.items.length+' items)?'))return;
    DATA=defaultized(d);
    persist();render();toast('Backup imported ✓');
  });
}

function localEstimate(title,desc,cat,cond){
  const hay=(title+' '+(desc||'')+' '+(cat||'')).toLowerCase();
  let band=null;
  const inch=(hay.match(/(\d{2})\s*(?:[- ]?inch|″|"|”)/)||[])[1];
  if(/\b(tv|television|smart tv)\b/.test(hay)&&inch){
    const b=tvRangeByInch(inch);
    band={min:b[0],max:b[1],label:inch+'″ TV',cat:'Electronics'};
  }else{
    for(const g of GUIDE){
      if(g.re.test(hay)){band={min:g.min,max:g.max,label:g.label,cat:g.cat};break}
    }
  }
  if(!band){
    const d=(cat&&CAT_DEFAULT[cat])||null;
    band=d?{min:d[0],max:d[1],label:cat.toLowerCase()+' item',cat:cat}
          :{min:100,max:1500,label:'household item',cat:cat||''};
  }
  let m=COND_MULT[cond]||0.78;
  if(/(broken|for parts|\bspares\b|not working|damaged|cracked screen)/.test(hay))m=Math.min(m,0.32);
  const mb=BRAND_MULT.find(x=>x[0].test(hay));
  let brandNote='';
  if(mb&&m>0.32){m=m*mb[1];brandNote=' — '+mb[2]+' premium applied';}
  const mn=roundR(band.min*m),mx=Math.max(mn,roundR(band.max*m));
  const reason='Rough guide for a second-hand '+band.label+' in '+cond+' condition on SA classifieds (rands)'+brandNote+'. '
    +'Brand, age and demand shift it a lot — double-check a few live listings with the 🔍 button'+(S.stage&&S.stage.length?' (a free key in ✨ settings also auto-fills the listing from your photos)':'')+'.';
  return {min:mn,max:mx,reason:reason,cat:band.cat,src:'guide'};
}

function parseAI(txt){
  let t=String(txt||'');
  try{return JSON.parse(t)}catch(e){}
  t=t.replace(/```[a-zA-Z]*/g,'').replace(/```/g,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const m=t.match(/\{[\s\S]*\}/);
  if(m){try{return JSON.parse(m[0])}catch(e){}}
  return null;
}

}

      return;
    }
    if(!r.ok){ghShow('<span style="color:var(--danger)">⚠ GitHub could not be reached (HTTP '+r.status+').</span>'+ghRetry());return}
    let sha=null;
    r=await fetch(api+'/contents/index.html',{headers:H});
    if(r.ok){try{sha=(await r.json()).sha}catch(_){}}
    const msg='Catalog update '+new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    r=await fetch(api+'/contents/index.html',{method:'PUT',headers:H,body:JSON.stringify({message:msg,content:b64utf8(buildShareHTML()),branch:'main',sha:sha||undefined})});

      const b=await fetch(api+'/pages/builds/latest',{headers:H});
      if(!b.ok){break} // token without Pages permission — stop polling quietly
      const j=await b.json();
      if(j.status==='errored'){ghShow('<span style="color:var(--danger)">⚠ GitHub had a build error — click Publish again in a minute.</span>');return}
      if(j.status==='built'){

      ghShow('⏳ Building… '+((i+1)*4)+' s <a class="lnk" target="_blank" rel="noopener" href="'+ghLiveUrl()+'">open shop ↗</a>');
    }
    ghShow('📦 Uploaded — GitHub is finalizing it. Check <a class="lnk" target="_blank" rel="noopener" href="'+ghLiveUrl()+'">'+esc(ghLiveUrl())+'</a> in a minute.');
  }catch(e){
    ghShow('<span style="color:var(--danger)">⚠ Could not reach GitHub ('+esc(e&&e.message||'network')+').</span> Check your connection and try again.'+ghRetry());
  }
}

/* ================= boot ================= */
async function boot(){
  try{if(sessionStorage.getItem('hhsAdmin')==='1')S.admin=true}catch(_){}
  if(location.hash==='#admin')S.mode='admin';
  let embedded=null;
  try{const t=document.getElementById('data').textContent.trim();embedded=t?JSON.parse(t):null}
  catch(_){embedded=null}
  const local=await kvGet('data');
  const useLocal=local&&local.items&&(!embedded||num(local.savedAt)>=num(embedded.savedAt));
  DATA=defaultized(useLocal?local:(embedded||defaultData()));
  SECRETS=(await kvGet('secrets'))||{};
  if(!SECRETS.ghOwner)SECRETS.ghOwner='upstartcx';
  if(!SECRETS.ghRepo)SECRETS.ghRepo='house-sale';
  if(!useLocal&&embedded)kvSet('data',DATA);
  document.title=DATA.settings.shopTitle||'Moving House Sale';
  startListeners();
  render();
}
boot().catch(e=>{document.body.insertAdjacentHTML('beforeend','<div style="padding:30px;text-align:center;white-space:pre-wrap">Something went wrong starting the app:\n'+esc(e&&e.message||e)+'</div>')});
})();
</script>
